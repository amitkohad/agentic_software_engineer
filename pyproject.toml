[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-software-engineer"
version = "0.1.0"
description = "Enterprise-grade agentic software engineering platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45",
    "fastapi",
    "langgraph",
    "openai",
    "pydantic",
    "rich",
    "python-dotenv",
    "streamlit>=1.42",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_software_engineer", "src/app"]
